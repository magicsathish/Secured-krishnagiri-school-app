name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Generate Android Studio Project
      run: |
        mkdir -p app/src/main/java/org/digitalindia/krishnagiri
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p app/src/main/assets

        # Copy HTML & Assets into Android assets
        cp index.html app/src/main/assets/index.html
        [ -f manifest.json ] && cp manifest.json app/src/main/assets/
        [ -f sw.js ] && cp sw.js app/src/main/assets/
        [ -f icon-192.png ] && cp icon-192.png app/src/main/assets/
        [ -f icon-512.png ] && cp icon-512.png app/src/main/assets/

        # Copy Icons to mipmap
        [ -f icon-192.png ] && cp icon-192.png app/src/main/res/mipmap-hdpi/ic_launcher.png
        [ -f icon-192.png ] && cp icon-192.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
        [ -f icon-512.png ] && cp icon-512.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        [ -f icon-512.png ] && cp icon-512.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

        # Create settings.gradle
        cat << "GRADLE_SETTINGS" > settings.gradle
        rootProject.name = "DigitalIndiaKrishnagiri"
        include ":app"
        GRADLE_SETTINGS

        # Create root build.gradle
        cat << "ROOT_BUILD" > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:8.2.2"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        ROOT_BUILD

        # Create gradle.properties
        cat << "PROPS" > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        PROPS

        # Create app/build.gradle
        cat << "APP_BUILD" > app/build.gradle
        plugins {
            id "com.android.application"
        }

        android {
            namespace "org.digitalindia.krishnagiri"
            compileSdk 34

            defaultConfig {
                applicationId "org.digitalindia.krishnagiri"
                minSdk 21
                targetSdk 34
                versionCode 340
                versionName "3.4.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation "androidx.appcompat:appcompat:1.6.1"
            implementation "androidx.webkit:webkit:1.10.0"
        }
        APP_BUILD

        # Create AndroidManifest.xml
        cat << "MANIFEST" > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.VIBRATE" />

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="Digital India Krishnagiri"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>

        </manifest>
        MANIFEST

        # Create strings.xml and styles.xml
        cat << "STRINGS" > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Digital India Krishnagiri</string>
        </resources>
        STRINGS

        cat << "STYLES" > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:windowNoTitle">true</item>
                <item name="android:windowActionBar">false</item>
                <item name="android:windowFullscreen">true</item>
            </style>
        </resources>
        STYLES

        # Create MainActivity.java
        cat << "ACTIVITY" > app/src/main/java/org/digitalindia/krishnagiri/MainActivity.java
        package org.digitalindia.krishnagiri;

        import android.annotation.SuppressLint;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {

            private WebView webView;

            @SuppressLint("SetJavaScriptEnabled")
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                setContentView(webView);

                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setDatabaseEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                webSettings.setLoadWithOverviewMode(true);
                webSettings.setUseWideViewPort(true);

                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            public void onBackPressed() {
                if (webView != null && webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        ACTIVITY

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.2.2"

    - name: Build Android APK
      run: |
        gradle assembleDebug
        cp app/build/outputs/apk/debug/app-debug.apk ./Digital_India_Krishnagiri_V3.4.0_Exhibition_Master.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Digital_India_Krishnagiri_V3.4.0_APK
        path: ./Digital_India_Krishnagiri_V3.4.0_Exhibition_Master.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
      with:
        tag_name: v3.4.0-exhibition-master
        name: "Digital India Krishnagiri V3.4.0 Exhibition Master (Android APK)"
        body: |
          ## 📱 Digital India – Krishnagiri School App V3.4.0 Exhibition Master
          Government Boys Higher Secondary School, Gandhi Road, Krishnagiri

          - **Version:** V3.4.0 Exhibition Master
          - **Security:** Integrated DRM Vault (Default PIN: `1234`)
          - **Offline:** 100% Standalone & Offline Ready
          
          Download the attached `Digital_India_Krishnagiri_V3.4.0_Exhibition_Master.apk` file and install directly on any Android device!
        files: |
          ./Digital_India_Krishnagiri_V3.4.0_Exhibition_Master.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
